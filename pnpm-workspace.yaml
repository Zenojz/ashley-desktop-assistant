allowBuilds:
  electron: true
  # This package only creates Windows installers and is not used for the macOS app.
  electron-winstaller: false
  esbuild: true
  protobufjs: true

overrides:
  # Patch the vulnerable transitive dependencies used by electron-builder.
  '@xmldom/xmldom@>=0.7.0 <=0.8.14': 0.8.15
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
  'fast-uri@>=3.0.0 <3.1.8': 3.1.8
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'undici@>=6.0.0 <6.28.1': 6.29.0

patchedDependencies:
  openwakeword-wasm-browser@0.1.1: patches/openwakeword-wasm-browser@0.1.1.patch
